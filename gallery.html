<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Order photos</title>
<style>
    :root { --bg:#ffffff; --text:#1a1a1a; --muted:#666; --card:#f4f4f6; --border:#d8d8de; }
    @media (prefers-color-scheme: dark) { :root { --bg:#16161a; --text:#ececf0; --muted:#9a9aa5; --card:#202026; --border:#34343c; } }
    body { margin:0; padding:20px 16px 40px; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
    main { max-width:900px; margin:0 auto; }
    h1 { font-size:20px; margin:0 0 4px; }
    .sub { color:var(--muted); margin:0 0 20px; font-size:14px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:16px; }
    .card h2 { font-size:16px; margin:0 0 2px; }
    .meta { color:var(--muted); font-size:13px; margin-bottom:8px; }
    .flag { display:inline-block; font-size:12px; border:1px solid var(--border); border-radius:10px; padding:1px 8px; margin-right:4px; }
    .photos { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:8px; margin-top:10px; }
    .photos img { width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:6px; border:1px solid var(--border); background:#888; }
    /* order photos (slip, contents) are often landscape: show them whole instead of cropped */
    .photos.wide { grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); }
    .photos.wide img { aspect-ratio:4/3; object-fit:contain; background:var(--card); }
    .msg { color:var(--muted); }
</style>
</head>
<body>
<main>
    <h1 id="title">Order photos</h1>
    <p class="sub" id="sub"></p>
    <div id="out"><p class="msg">Loading...</p></div>
</main>
<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const URL = 'https://kfxukzvuufmowapjagro.supabase.co';
    const KEY = 'sb_publishable_D6suMyjdFr7vKDgGdo5DJQ_v36kiBUe';
    const LABELS = { wrong_condition: 'Wrong condition', wrong_item: 'Wrong item', error: 'Error card', grading: 'Held for grading', waiting_seller: 'Waiting on seller' };
    const esc = (s) => (s ?? '').toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const out = document.getElementById('out');
    const token = new URLSearchParams(location.search).get('t');
    if (!token) {
        out.innerHTML = '<p class="msg">This link is missing its code.</p>';
    } else {
        const sb = createClient(URL, KEY);
        const { data, error } = await sb.rpc('tcg_gallery', { p_token: token });
        if (error || !data) {
            out.innerHTML = '<p class="msg">This gallery was not found.</p>';
        } else {
            document.getElementById('title').textContent = `Photos for order ${data.order_number}`;
            document.getElementById('sub').textContent = data.ordered_on ? `Ordered ${data.ordered_on}` : '';
            const img = (p) => `<a href="${URL}/storage/v1/object/public/tcg-held-photos/${encodeURI(p)}" target="_blank" rel="noopener"><img loading="lazy" alt="" src="${URL}/storage/v1/object/public/tcg-held-photos/${encodeURI(p)}"></a>`;
            const KIND = { slip: 'Packing slip', contents: 'Opened contents', package: 'Package', other: 'Photo' };
            const parts = [];
            const missing = data.missing || [];
            if (missing.length) parts.push(`
                <section class="card">
                    <h2>Missing from the package</h2>
                    <div class="meta">These cards are on the order but were not in the package:</div>
                    <ul style="margin:6px 0 0 18px; padding:0;">${missing.map(m => `<li>${esc(m.card_name)}${m.card_number ? ` #${esc(m.card_number)}` : ''}${m.qty > 1 ? ` x${esc(m.qty)}` : ''}</li>`).join('')}</ul>
                </section>`);
            const op = data.order_photos || [];
            if (op.length) parts.push(`
                <section class="card">
                    <h2>Photos of the order</h2>
                    <div class="photos wide">${op.map(p => `<figure style="margin:0;">${img(p.path)}<figcaption class="meta">${esc(KIND[p.kind] || 'Photo')}${p.caption ? ' · ' + esc(p.caption) : ''}</figcaption></figure>`).join('')}</div>
                </section>`);
            for (const c of data.cards || []) parts.push(`
                <section class="card">
                    <h2>${esc(c.card_name)}${c.card_number ? ` #${esc(c.card_number)}` : ''}</h2>
                    <div class="meta">${c.received ? `Ordered: ${esc(c.card_name)}${c.condition ? ` (${esc(c.condition)})` : ''} · Received: ${esc(c.received)}` : `${esc(c.set)}${c.condition ? ` · listed as ${esc(c.condition)}` : ''}`}</div>
                    <div>${(c.flags || []).map(f => `<span class="flag">${esc(LABELS[f] || f)}</span>`).join('')}</div>
                    <div class="photos">${(c.photos || []).map(img).join('')}</div>
                </section>`);
            out.innerHTML = parts.length ? parts.join('') : '<p class="msg">No photos have been added to this order yet.</p>';
        }
    }
</script>
</body>
</html>
