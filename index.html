<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card-Board-MasterMind</title>
    <style>
        :root {
            --bg: #0f0f10;
            --bg-secondary: #1a1a1c;
            --bg-tertiary: #232326;
            --border: #333336;
            --text: #e8e8ea;
            --text-secondary: #9a9a9e;
            --accent: #4a8cff;
            --success: #3ecf8e;
            --warning: #f5a623;
            --danger: #e5534b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .app-shell {
            display: flex;
            min-height: 100vh;
        }

        nav.sidebar {
            width: 200px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 16px 0;
            flex-shrink: 0;
        }

        nav.sidebar .brand {
            font-size: 15px;
            font-weight: 600;
            padding: 0 16px 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 8px;
        }

        nav.sidebar .nav-group-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
            padding: 16px 16px 6px;
        }

        nav.sidebar a {
            display: block;
            padding: 10px 16px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
        }

        nav.sidebar a:hover {
            background: var(--bg-tertiary);
            color: var(--text);
        }

        nav.sidebar a.active {
            background: var(--bg-tertiary);
            color: var(--accent);
            border-left: 2px solid var(--accent);
        }

        main {
            flex: 1;
            padding: 24px;
            overflow-x: auto;
        }

        .auth-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            gap: 12px;
        }

        .btn {
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        .btn:hover { border-color: var(--accent); }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--text-secondary);
            font-weight: 500;
            position: sticky;
            top: 0;
            background: var(--bg);
        }

        tr:hover td { background: var(--bg-secondary); }

        select, input[type="text"], input[type="number"], input[type="search"] {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 13px;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 500;
        }

        .badge-matched { background: rgba(62,207,142,0.15); color: var(--success); }
        .badge-ambiguous { background: rgba(245,166,35,0.15); color: var(--warning); }
        .badge-not_found { background: rgba(229,83,75,0.15); color: var(--danger); }

        .filters-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .pagination {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { requireAuth, signOut } from './shared.js';

        const app = document.getElementById('app');

        const session = await requireAuth(app);
        if (!session) {
            // Sign-in screen already rendered by requireAuth
        } else {
            renderShell();
        }

        function renderShell() {
            app.innerHTML = `
                <div class="app-shell">
                    <nav class="sidebar">
                        <div class="brand">Card-Board-MasterMind</div>
                        <div class="nav-group-label">Workflow</div>
                        <a href="#dashboard" data-page="dashboard">Dashboard</a>
                        <a href="#staging" data-page="staging">Staging Review</a>
                        <a href="#inventory" data-page="inventory">Inventory</a>
                        <a href="#purchases" data-page="purchases">Purchases</a>
                        <a href="#sales" data-page="sales">Sales</a>
                        <a href="#catalog" data-page="catalog">Catalog</a>
                        <a href="#configuration" data-page="configuration">Configuration</a>
                        <a href="#" id="signout-link" style="margin-top:16px;border-top:1px solid var(--border);padding-top:16px;">Sign out</a>
                    </nav>
                    <main id="page-content">
                        <p>Loading...</p>
                    </main>
                </div>
            `;

            document.getElementById('signout-link').addEventListener('click', (e) => {
                e.preventDefault();
                signOut();
            });

            window.addEventListener('hashchange', loadPage);
            loadPage();
        }

        async function loadPage() {
            const hash = window.location.hash.replace('#', '') || 'dashboard';
            const content = document.getElementById('page-content');

            const configKeys = ['configuration', 'sets', 'card-games', 'pricing-rules', 'listing-templates'];
            document.querySelectorAll('nav.sidebar a[data-page]').forEach(a => {
                const isConfigActive = a.dataset.page === 'configuration' && configKeys.includes(hash);
                a.classList.toggle('active', a.dataset.page === hash || isConfigActive);
            });

            content.innerHTML = '<p>Loading...</p>';

            try {
                switch (hash) {
                    case 'staging': {
                        const { renderStagingReview } = await import(`./staging-review.js?v=${Date.now()}`);
                        await renderStagingReview(content);
                        break;
                    }
                    case 'dashboard':
                    case 'inventory': {
                        const { renderInventory } = await import(`./inventory.js?v=${Date.now()}`);
                        await renderInventory(content);
                        break;
                    }
                    case 'purchases': {
                        const { renderPurchases } = await import(`./purchases.js?v=${Date.now()}`);
                        await renderPurchases(content);
                        break;
                    }
                    case 'sales': {
                        const { renderSales } = await import(`./sales.js?v=${Date.now()}`);
                        await renderSales(content);
                        break;
                    }
                    case 'catalog': {
                        const { renderCatalog } = await import(`./catalog.js?v=${Date.now()}`);
                        await renderCatalog(content);
                        break;
                    }
                    case 'configuration':
                    case 'sets':
                    case 'card-games':
                    case 'pricing-rules':
                    case 'listing-templates': {
                        const { renderConfiguration } = await import(`./configuration.js?v=${Date.now()}`);
                        const subKey = hash === 'configuration' ? 'sets' : hash;
                        await renderConfiguration(content, subKey);
                        break;
                    }
                    default:
                        content.innerHTML = '<p>Page not found.</p>';
                }
            } catch (err) {
                console.error(err);
                content.innerHTML = `<p style="color:var(--danger)">Failed to load page: ${err.message}</p>`;
            }
        }
    </script>
</body>
</html>
